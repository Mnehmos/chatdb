[project]
name = "chatdb-sidecar"
version = "0.1.0"
description = "ChatDB Python sidecar: validators, council, scout, librarian"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "sympy>=1.13",
    "pint>=0.24",
    "httpx>=0.27.0",
    "pydantic>=2.9",
    "mcp>=1.0",
    "anyio>=4.0",
]
[project.optional-dependencies]
research = ["arxiv>=2.1", "semanticscholar>=0.8"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]
